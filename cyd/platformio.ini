[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Auftrag "Sicherheit und Lizenzen" (Teil 1b-3): entfernt absolute
; Build-Rechner-Pfade (Benutzername!) aus der fertigen firmware.bin,
; siehe trim_paths.py.
extra_scripts = pre:trim_paths.py

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4
    ; Auftrag "Alexa-Test 1": WeMo-Emulation (SSDP+HTTP), siehe
    ; config.h::ALEXA_TEST. Wird nur dann tatsaechlich einkompiliert, wenn
    ; main.cpp fauxmoESP.h includiert (hinter #ifdef ALEXA_TEST) - im
    ; Normalbetrieb bleiben die Symbole unreferenziert und fallen beim
    ; Linken (--gc-sections) weg, kein Flash-Mehrverbrauch ohne das Flag.
    vintlabs/fauxmoESP @ ^3.4.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
